version: '3.9'

services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: dashboard
      MYSQL_USER: scp682
      MYSQL_PASSWORD: Ucompensar.
      MYSQL_ROOT_PASSWORD: komachi22
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://scp682:Ucompensar.@db:3306/dashboard

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - db

volumes:
  mysql_data:
